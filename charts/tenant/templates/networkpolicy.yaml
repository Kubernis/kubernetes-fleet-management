{{- if .Values.networkPolicy.enabled }}
# Deny-by-default ingress for the tenant, then allow same-namespace traffic.
#
# Two objects, because an empty podSelector policy denies everything and a second
# policy is what adds back the traffic a tenant's own pods need between
# themselves. Cross-namespace ingress is a deliberate ask, not a default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.tenant.name | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
  namespace: {{ .Values.tenant.name | quote }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
{{- end }}
