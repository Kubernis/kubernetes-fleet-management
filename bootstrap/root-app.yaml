apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-local-k3d
  namespace: argocd
  labels:
    port-environment: "platform"
    app.kubernetes.io/part-of: fleet-management
spec:
  project: default
  source:
    repoURL: https://github.com/Kubernis/kubernetes-fleet-management.git
    targetRevision: main
    path: clusters/local-k3d
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
