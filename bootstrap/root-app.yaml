apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fleet-local-k3d
  namespace: argocd
  labels:
    # Deliberately NOT labelled port-environment. That label means "this
    # Application belongs to a tenant environment", and the Port mapping
    # creates an environment entity from it. The fleet root is not a tenant —
    # labelling it conjured a phantom environment called "platform" into the
    # catalog with every property null.
    app.kubernetes.io/part-of: fleet-management
spec:
  project: default
  source:
    repoURL: https://github.com/Kubernis/kubernetes-fleet-management.git
    targetRevision: main
    path: clusters/local-k3d
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
