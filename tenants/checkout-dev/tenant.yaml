# A tenant request. This file is the ENTIRE developer-facing surface — Port's
# self-service form writes it, a PR reviews it, the ApplicationSet acts on it.
#
# Note what is absent: no namespace manifest, no quota numbers, no ArgoCD
# Application, no sync policy, no cluster endpoint. A developer cannot express
# non-standard here, because the vocabulary does not contain it.
tenant:
  name: checkout-dev
  team: checkout
  stage: dev
  tier: small
  requestedBy: platform@kubernis.io
